[project]
name = "pia-cafeteria"
version = "1.0.0"
description = "API REST para la administración de una cafetería: productos, inventario, pedidos y ventas"
authors = [
    { name = "Angel Emiliano Carmona Lozano" },
    { name = "Luis Rolando Aguilar Ortiz" },
    { name = "Lilian Valeria Ramos Avila" }
]
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["fastapi (>=0.162.2,<0.163.0)", "uvicorn (>=0.54.0,<0.55.0)", "sqlalchemy (>=2.1.8,<3.0.0)", "pydantic-settings (>=2.16.2,<3.0.0)", "pyjwt (>=2.15.1,<3.0.0)", "bcrypt (>=5.0.0,<6.0.0)", "python-multipart (>=0.0.33,<0.0.34)"]

[tool.poetry]
package-mode = false

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
